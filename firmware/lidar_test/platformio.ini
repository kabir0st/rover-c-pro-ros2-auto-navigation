; LD06 lidar test for M5StickC / Plus / Plus2: shows lidar status on the screen and
; bridges the raw lidar stream to USB. Flashing this replaces the rover firmware;
; reflash firmware/rover afterwards.
; Build:  pio run            Flash:  pio run -t upload

[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 230400
lib_deps =
    m5stack/M5Unified@^0.3.0
