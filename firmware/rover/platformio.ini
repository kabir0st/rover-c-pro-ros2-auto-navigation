; RoverC Pro browser-control firmware for M5StickC / Plus / Plus2.
; Build:  pio run            Flash:  pio run -t upload       Logs:  pio device monitor

[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.3.0
    m5stack/M5-RoverC@^0.0.1
